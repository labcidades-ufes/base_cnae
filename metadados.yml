limitacoes_conhecidas: A cobertura validada contém quatro classificações; CNAE 1.0, CNAE-Fiscal 1.1, CNAE
  2.1, classificações domiciliares e demais versões não estão integradas à coleta atual. Classes e subclasses
  não são intercambiáveis; sempre selecionar versao_cnae. nome_subclasse também descreve classes. A silver
  é posicional e ainda contém linhas hierárquicas. A gold corrige especificamente o código de corte e
  dobra de metais na versão 2.2 conforme as notas explicativas oficiais, mantendo a bronze original. As
  novas cargas usam Parquets datados e entradas explícitas. Cargas anteriores conservam seus caminhos
  datados. Proteção contra sobrescrita validada em homologação e alertas de falha configurados; consultar
  protecao_gravacao e alertas_operacionais. A aprovação final permanece pendente.
