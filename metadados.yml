rastreabilidade:
  identificador: carga_id
  geracao: SHA-256 do run_id do Airflow, codificado em UTF-8.
  vinculo: As etapas compartilham carga_id e data de referência do início do DagRun. Silver lê a bronze
    datada explicitamente; gold lê a silver da mesma data. Fontes e manifestos permanecem identificados
    por carga_id.
  manifesto: bronze/base_cnae/cargas/<carga_id>/fontes/manifesto.csv
  originais: bronze/base_cnae/cargas/<carga_id>/fontes/
  data_coleta: Permanece como atributo da bronze, silver e manifesto; o caminho dos objetos identifica
    a execução.
  limite: Execuções na mesma data utilizam os mesmos destinos Parquet. Destino existente é rejeitado pela
    gravação condicional. Novo run_id não elimina essa colisão.
protecao_gravacao:
  estado: validada_em_homologacao
  mecanismo: 'If-None-Match: *'
  regra: 'Envio com If-None-Match: *. Destino existente é rejeitado com HTTP 412. Preservar cargas parciais
    para análise. Uma nova execução completa depende de destinos datados livres; mudar somente o run_id
    não permite sobrescrever os arquivos existentes.'
  limite_arquivo: 4 GiB por arquivo nesta implementação; sem multipart.
  armazenamento_temporario: Parquet gerado localmente antes do upload; requer espaço temporário suficiente
