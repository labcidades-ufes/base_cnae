identificador: base_cnae
descricao: Base de referência CNAE obtida de ZIPs oficiais do IBGE. A cobertura atualmente validada compreende
  CNAE 2.0 Classes, CNAE 2.0 Subclasses, CNAE 2.2 Subclasses e CNAE 2.3 Subclasses. O pipeline preserva
  os ZIPs e um manifesto, normaliza as estruturas posicionais e produz uma gold com hierarquia e denominações
  por classificação.
